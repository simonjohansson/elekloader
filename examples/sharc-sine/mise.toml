[tools]
python = "3.12.13"

[tasks.build-c]
description = "Compile the current C sine and build DN2 firmware"
run = "python build.py c"

[tasks.build-asm]
description = "Assemble the current SHARC sine and build DN2 firmware"
run = "python build.py asm"

[tasks.build-c-l1]
description = "Maintainer regression: build the C sine in the original 1 KiB area"
run = "python build.py c --l1"

[tasks.build-asm-l1]
description = "Maintainer regression: build the ASM sine in the original 1 KiB area"
run = "python build.py asm --l1"

[tasks.test]
description = "Check the artifact producer without firmware or compilers"
run = "python ../../tests/test_sharc_build.py"
